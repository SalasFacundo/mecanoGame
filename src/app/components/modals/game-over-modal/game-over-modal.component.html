<div *ngIf="visible" class="screen">
  <div class="component">
    <div class="title">GAME OVER</div>
    <div class="subtitle">Your score is: {{score}}</div>
    <div class="title mt-5">¿Play Again?</div>
    <div class="buttons">
      <button class="btn btn-primary" (click)="onClickButton(true)">Yes</button>
      <button class="btn btn-primary"  (click)="onClickButton(true)">No</button>
    </div>
  </div>
</div>
